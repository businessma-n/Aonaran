name: Build .NET Framework
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v1
      - run: nuget restore Aonaran.sln
      - run: msbuild Aonaran.sln /p:Configuration=Release -m
